# PkpWays datastores — PostgreSQL 18 + Redis.
#
# Brings up the two backing stores and the data-sync worker. The worker
# connects to the stores over the internal compose network.
#
# Usage:
#   cp .env.example .env      # then edit passwords
#   docker compose up -d      # start
#   docker compose ps         # check health
#   docker compose logs -f    # tail logs
#   docker compose down       # stop (keeps data in named volumes)
#
# Ports are bound to 127.0.0.1 only — reachable from the VPS itself (where the
# worker runs) but not the public internet. From your laptop, tunnel in with:
#   ssh -L 5432:127.0.0.1:5432 -L 6379:127.0.0.1:6379 user@your-vps
# To expose publicly instead, change "127.0.0.1:5432:5432" -> "5432:5432" and
# make sure you have a firewall + strong passwords.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pkpways}
      POSTGRES_USER: ${POSTGRES_USER:-pkpways}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Timestamps from the PKP API are Europe/Warsaw local wall-clock time.
      TZ: Europe/Warsaw
      PGTZ: Europe/Warsaw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18+ images store data in a version-specific subdir, so mount the
      # PARENT (/var/lib/postgresql), not /var/lib/postgresql/data.
      - pg_data:/var/lib/postgresql
      # schema.sql runs automatically ON FIRST INIT ONLY (empty data dir).
      # Re-applying later: docker compose exec -T postgres \
      #   psql -U pkpways -d pkpways < schema.sql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pkpways} -d ${POSTGRES_DB:-pkpways}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Rebuildable hot cache: cap memory and avoid AOF/RDB write amplification.
    # The worker warms Redis from Postgres immediately after a restart.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - ${REDIS_MAXMEMORY:-768mb}
      - --maxmemory-policy
      - volatile-lfu
    mem_limit: ${REDIS_CONTAINER_MEMORY:-1g}
    pids_limit: 100
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # data-sync worker — polls the PKP API into Postgres + Redis.
  # Talks to the datastores over the internal compose network, so the hosts
  # are the service names "postgres" / "redis" (NOT localhost).
  data-sync:
    build: ./data-sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PKP_API_KEY: ${PKP_API_KEY:?set PKP_API_KEY in .env}
      PKP_API_BASE_URL: ${PKP_API_BASE_URL:-https://pdp-api.plk-sa.pl/api/v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pkpways}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pkpways}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-1800}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Next.js map UI. Reads Postgres/Redis over the internal compose network and
  # never calls the PKP API. Deliberately NOT published to the host — only the
  # caddy service can reach it.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CARTO_API_KEY: ${CARTO_API_KEY:-${NEXT_PUBLIC_CARTO_API_KEY:-}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pkpways}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pkpways}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEXT_PUBLIC_CARTO_API_KEY: ${CARTO_API_KEY:-${NEXT_PUBLIC_CARTO_API_KEY:-}}
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TLS terminator / reverse proxy. Obtains and renews Let's Encrypt certs
  # automatically; the certs live in the caddy_data volume, so don't delete it
  # (re-issuing on every restart will hit Let's Encrypt rate limits).
  caddy:
    # Built from ./caddy rather than the stock image: the official caddy image
    # ships no DNS provider plugins, and a wildcard certificate can only be
    # validated by DNS-01. See caddy/Dockerfile.
    build: ./caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # Reaches hopd, which runs on the host under systemd rather than in this
      # stack, so tunnels are unaffected by compose restarts.
      - "host.docker.internal:host-gateway"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
  caddy_data:
  caddy_config:
