# PkpWays datastores — PostgreSQL 18 + Redis.
#
# Brings up the two backing stores for the data-sync worker. The worker itself
# is NOT included here (it's being rewritten); it connects to these over the
# DATABASE_URL / REDIS_URL it reads from its own env.
#
# Usage:
#   cp .env.example .env      # then edit passwords
#   docker compose up -d      # start
#   docker compose ps         # check health
#   docker compose logs -f    # tail logs
#   docker compose down       # stop (keeps data in named volumes)
#
# Ports are bound to 127.0.0.1 only — reachable from the VPS itself (where the
# worker runs) but not the public internet. From your laptop, tunnel in with:
#   ssh -L 5432:127.0.0.1:5432 -L 6379:127.0.0.1:6379 user@your-vps
# To expose publicly instead, change "127.0.0.1:5432:5432" -> "5432:5432" and
# make sure you have a firewall + strong passwords.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pkpways}
      POSTGRES_USER: ${POSTGRES_USER:-pkpways}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Timestamps from the PKP API are Europe/Warsaw local wall-clock time.
      TZ: Europe/Warsaw
      PGTZ: Europe/Warsaw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18+ images store data in a version-specific subdir, so mount the
      # PARENT (/var/lib/postgresql), not /var/lib/postgresql/data.
      - pg_data:/var/lib/postgresql
      # schema.sql runs automatically ON FIRST INIT ONLY (empty data dir).
      # Re-applying later: docker compose exec -T postgres \
      #   psql -U pkpways -d pkpways < schema.sql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pkpways} -d ${POSTGRES_DB:-pkpways}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Password-protected + AOF persistence so the hot cache survives restarts.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # data-sync worker — polls the PKP API into Postgres + Redis.
  # Talks to the datastores over the internal compose network, so the hosts
  # are the service names "postgres" / "redis" (NOT localhost).
  data-sync:
    build: ./data-sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PKP_API_KEY: ${PKP_API_KEY:?set PKP_API_KEY in .env}
      PKP_API_BASE_URL: ${PKP_API_BASE_URL:-https://pdp-api.plk-sa.pl/api/v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pkpways}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pkpways}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  pg_data:
  redis_data:
